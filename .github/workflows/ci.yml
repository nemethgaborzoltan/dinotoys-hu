name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      # Build first so the TanStack router plugin can regenerate routeTree.gen.ts.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
